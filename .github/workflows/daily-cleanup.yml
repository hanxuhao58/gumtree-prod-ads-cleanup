name: 每日广告清理任务

# 工作流已激活 - 2025-01-XX
on:
  schedule:
    # 每天凌晨 3:00 北京时间 = 19:00 UTC (前一天)
    - cron: '0 19 * * *'
  workflow_dispatch:  # 允许手动触发
    inputs:
      environment:
        description: '运行环境（prod=生产环境，bixi=测试环境）'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - bixi
      send_email:
        description: '是否发送邮件报告'
        required: true
        default: true
        type: boolean
      run_reason:
        description: '运行原因/备注（可选，用于记录手动触发的原因）'
        required: false
        type: string
        default: '手动触发'

env:
  TZ: Asia/Shanghai

jobs:
  cleanup-ads:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          sudo mv apache-jmeter-5.6.3 /opt/jmeter
          echo "/opt/jmeter/bin" >> $GITHUB_PATH

      - name: 验证 JMeter 安装
        run: |
          jmeter --version

      - name: 创建必要目录
        run: |
          mkdir -p logs reports data

      - name: 运行广告清理脚本
        id: run_cleanup
        run: |
          cd scripts
          # 使用手动输入的环境或默认使用 prod
          ENV="${{ github.event.inputs.environment || 'prod' }}"
          echo "运行环境: $ENV"
          bash run_cleanup_multi.sh --env $ENV <<< "yes"
        continue-on-error: true

      - name: 生成报告摘要
        id: generate_summary
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          LOG_FILE=$(ls -t logs/multi_cleanup_*.log 2>/dev/null | head -1)
          
          if [ -f "$LOG_FILE" ]; then
            echo "LOG_FILE=$LOG_FILE" >> $GITHUB_OUTPUT
            
            # 提取统计信息（只从账号处理完成的摘要中提取）
            # 只统计带 ✅ 标记的账号处理完成行
            TOTAL_ACCOUNTS=$(grep -c "✅ 账号.*处理完成" "$LOG_FILE" || echo "0")
            TOTAL_ACTIVE=$(grep "📊 发现活跃广告:" "$LOG_FILE" | grep -o "[0-9]\+ 个" | grep -o "[0-9]\+" | awk '{sum += $1} END {print sum+0}')
            TOTAL_INACTIVE=$(grep "💤 非活跃广告:" "$LOG_FILE" | grep -o "[0-9]\+ 个" | grep -o "[0-9]\+" | awk '{sum += $1} END {print sum+0}')
            TOTAL_DELETED=$(grep "🗑️  成功删除:" "$LOG_FILE" | grep -o "[0-9]\+ 个" | grep -o "[0-9]\+" | awk '{sum += $1} END {print sum+0}')
            
            echo "TOTAL_ACCOUNTS=$TOTAL_ACCOUNTS" >> $GITHUB_OUTPUT
            echo "TOTAL_ACTIVE=$TOTAL_ACTIVE" >> $GITHUB_OUTPUT
            echo "TOTAL_INACTIVE=$TOTAL_INACTIVE" >> $GITHUB_OUTPUT
            echo "TOTAL_DELETED=$TOTAL_DELETED" >> $GITHUB_OUTPUT
            
            # 生成日期和环境信息
            REPORT_DATE=$(date '+%Y年%m月%d日')
            REPORT_TIME=$(date '+%Y-%m-%d %H:%M:%S %Z')
            REPORT_DATETIME=$(date '+%Y年%m月%d日 %H:%M:%S')
            
            # 输出日期供邮件使用
            echo "REPORT_DATE=$REPORT_DATE" >> $GITHUB_OUTPUT
            echo "REPORT_DATETIME=$REPORT_DATETIME" >> $GITHUB_OUTPUT
            RUN_ENV="${{ github.event.inputs.environment || 'prod' }}"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              TRIGGER_TYPE="自动定时"
            else
              TRIGGER_TYPE="${{ github.event.inputs.run_reason || '手动触发' }}"
            fi
            GITHUB_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
            # 使用模板生成 HTML 报告
            cp .github/report_template.html report_summary.html
            
            # 替换占位符
            sed -i "s|{{REPORT_TIME}}|$REPORT_TIME|g" report_summary.html
            sed -i "s|{{RUN_ENV}}|$RUN_ENV|g" report_summary.html
            sed -i "s|{{TRIGGER_TYPE}}|$TRIGGER_TYPE|g" report_summary.html
            sed -i "s|{{GITHUB_RUN_URL}}|$GITHUB_RUN_URL|g" report_summary.html
            sed -i "s|{{TOTAL_ACCOUNTS}}|$TOTAL_ACCOUNTS|g" report_summary.html
            sed -i "s|{{TOTAL_ACTIVE}}|$TOTAL_ACTIVE|g" report_summary.html
            sed -i "s|{{TOTAL_INACTIVE}}|$TOTAL_INACTIVE|g" report_summary.html
            sed -i "s|{{TOTAL_DELETED}}|$TOTAL_DELETED|g" report_summary.html
            
            if [ "$RUN_ENV" = "prod" ]; then
              sed -i "s|{{ENV_CLASS}}|prod|g" report_summary.html
              sed -i "s|{{ENV_NAME}}|生产环境|g" report_summary.html
            else
              sed -i "s|{{ENV_CLASS}}|bixi|g" report_summary.html
              sed -i "s|{{ENV_NAME}}|测试环境|g" report_summary.html
            fi
            
            # 提取账号详情并生成 HTML
            ACCOUNTS_HTML=""
            grep -A 4 "✅ 账号.*处理完成" "$LOG_FILE" | while IFS= read -r line; do
              if echo "$line" | grep -q "✅ 账号"; then
                ACCOUNT_NAME=$(echo "$line" | sed 's/.*✅ 账号 \(.*\) 处理完成.*/\1/')
                echo "<div class=\"account-card\"><h3>$ACCOUNT_NAME</h3><div class=\"account-stats\">"
              elif echo "$line" | grep -q "📊 发现活跃广告"; then
                ACTIVE=$(echo "$line" | grep -o "[0-9]\+ 个" | grep -o "[0-9]\+")
                echo "<div class=\"account-stat\"><label>活跃广告</label><value>$ACTIVE 个</value></div>"
              elif echo "$line" | grep -q "💤 非活跃广告"; then
                INACTIVE=$(echo "$line" | grep -o "[0-9]\+ 个" | grep -o "[0-9]\+")
                echo "<div class=\"account-stat\"><label>非活跃广告</label><value>$INACTIVE 个</value></div>"
              elif echo "$line" | grep -q "🗑️  成功删除"; then
                DELETED=$(echo "$line" | grep -o "[0-9]\+ 个" | grep -o "[0-9]\+")
                echo "<div class=\"account-stat\"><label>成功删除</label><value>$DELETED 个</value></div></div></div>"
              fi
            done > accounts_temp.html
            
            sed -i "/{{ACCOUNTS_DETAILS}}/r accounts_temp.html" report_summary.html
            sed -i "/{{ACCOUNTS_DETAILS}}/d" report_summary.html
            
            echo "✅ HTML 报告生成完成"
            ls -lh report_summary.html
          else
            echo "❌ 未找到日志文件"
            echo "TOTAL_ACCOUNTS=0" >> $GITHUB_OUTPUT
            echo "TOTAL_ACTIVE=0" >> $GITHUB_OUTPUT
            echo "TOTAL_INACTIVE=0" >> $GITHUB_OUTPUT
            echo "TOTAL_DELETED=0" >> $GITHUB_OUTPUT
          fi

      - name: 上传日志文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-logs-${{ github.run_number }}
          path: |
            logs/*.log
            reports/*.jtl
            report_summary.html
          retention-days: 30

      - name: 发送邮件报告
        if: always() && (github.event.inputs.send_email != 'false')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Gumtree 线上测试数据清理日报 - ${{ steps.generate_summary.outputs.REPORT_DATE }} [${{ github.event.inputs.environment || 'prod' }}]"
          to: hanxuhao@58.com
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            ✅ Gumtree 线上测试数据清理任务执行完成
            
            📅 执行时间: ${{ steps.generate_summary.outputs.REPORT_DATETIME }}
            🌍 运行环境: ${{ github.event.inputs.environment || 'prod' }}
            🚀 触发方式: ${{ github.event_name == 'schedule' && '自动定时' || (github.event.inputs.run_reason || '手动触发') }}
            ${{ github.event.inputs.run_reason && format('📝 运行原因: {0}', github.event.inputs.run_reason) || '' }}
            
            📊 执行摘要
            ================
            处理账号数: ${{ steps.generate_summary.outputs.TOTAL_ACCOUNTS }} 个
            活跃广告: ${{ steps.generate_summary.outputs.TOTAL_ACTIVE }} 个
            非活跃广告: ${{ steps.generate_summary.outputs.TOTAL_INACTIVE }} 个
            成功删除: ${{ steps.generate_summary.outputs.TOTAL_DELETED }} 个
            
            📄 详细报告请查看附件
            
            🔗 查看完整日志:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ---
            此邮件由 GitHub Actions 自动发送
          attachments: report_summary.html
          convert_markdown: false
          priority: normal

      - name: 通知执行结果
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 任务执行成功"
          else
            echo "❌ 任务执行失败"
          fi

